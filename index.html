    <!-- Static defaults, identical to the home entry in src/data/seo.js. The
         app replaces these per route once it runs, but WhatsApp, Facebook,
         LinkedIn and some search crawlers read only this HTML and never run
         JavaScript, so without these a shared link shows no preview at all.
         og:url and canonical are deliberately NOT here: they differ per page,
         and a static value would tell those crawlers every page is the home
         page. The absolute domain below (and in the JSON-LD) must match
         site.domain in src/data/site.js. -->
    <title>TBWACT | Tambaram Builders Welfare and Charitable Trust</title>
